packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  # Bump these two together. A split pair fails at startup. Dependabot misses
  # the coupling through the npm: alias, so update both by hand.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

  # Effect: the core package plus its satellites share one version line.
  effect: ^4.1.2
  "@effect/platform-node": ^4.1.2
  "@effect/sql-pg": ^4.1.2
  "@effect/atom-react": ^4.1.2

  # Drizzle 1.0 is a release candidate (its Effect v4 driver is new in 1.0), so
  # pin exact versions and bump the pair together.
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5

  # Infrastructure as code. Alchemy v2 is still in beta, so pin exact versions
  # and bump the pair together.
  alchemy: 2.0.0-beta.85
  "@alchemy.run/docker": 2.0.0-beta.85

  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  tailwindcss: ^4.3.4
  "@tailwindcss/vite": ^4.3.4
  "@base-ui/react": ^1.9.0
  "@tanstack/react-router": ^1.170.0
  "@tanstack/router-plugin": ^1.169.0
  "@tanstack/react-table": ^9.3.0
  "@tanstack/react-form": ^1.33.0
  "@fontsource-variable/inter": ^5.3.0
  lucide-react: ^1.60.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Supply-chain policy
# New versions must be at least 4 days old before pnpm will resolve them.
minimumReleaseAge: 5760

# No dependency may run lifecycle (install/postinstall) scripts unless it is
# explicitly reviewed and listed in allowBuilds. Install fails loudly instead
# of silently skipping unreviewed build scripts.
strictDepBuilds: true
allowBuilds: {}

# Transitive dependencies must come from trusted registries: no git or
# tarball URLs below the direct-dependency level.
blockExoticSubdeps: true

# Refuse versions whose publisher trust level regressed (e.g. provenance
# silently dropped between releases).
trustPolicy: no-downgrade

# Keep node_modules in sync with the lockfile before running scripts.
verifyDepsBeforeRun: install

# Fail install on an engines mismatch (Node version) instead of warning.
engineStrict: true
